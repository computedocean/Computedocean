<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="Career timeline: joined Rackspace in 2005, worked up to Windows Admin IV, 18 years through 2023, Azure Administrator certification, now cloud and AI agent engineering">
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .track { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 2.6s ease-in-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .stop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
    .label { opacity: 0; animation: fade 0.6s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .s1 { animation-delay: 0.3s; } .s2 { animation-delay: 0.9s; } .s3 { animation-delay: 1.5s; } .s4 { animation-delay: 2.1s; } .s5 { animation-delay: 2.7s; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out 3.2s infinite; opacity: 0; }
    @keyframes ping { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; stroke-dashoffset: 0; }
      .stop, .label { animation: none; opacity: 1; }
      .ping { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0072C6"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="228" rx="12" fill="#0d1117" stroke="#1f6f8b" stroke-width="2"/>
  <text x="24" y="32" class="mono" fill="#6b7a90" font-size="12" letter-spacing="2">CAREER.LOG</text>

  <line x1="90" y1="112" x2="730" y2="112" stroke="#1b2a3a" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="112" x2="730" y2="112" stroke="url(#trackGrad)" stroke-width="4" stroke-linecap="round" class="track"/>

  <!-- 2005 -->
  <g class="stop s1"><circle cx="90" cy="112" r="11" fill="#0d1117" stroke="#0072C6" stroke-width="3"/><circle cx="90" cy="112" r="4" fill="#0072C6"/></g>
  <g class="label s1">
    <text x="90" y="80" text-anchor="middle" class="mono" fill="#58a6ff" font-size="15" font-weight="700">2005</text>
    <text x="90" y="148" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="600">Joined Rackspace</text>
    <text x="90" y="168" text-anchor="middle" class="sans" fill="#8b949e" font-size="12">Windows infrastructure</text>
  </g>

  <!-- Admin IV -->
  <g class="stop s2"><circle cx="250" cy="112" r="11" fill="#0d1117" stroke="#0a8ad6" stroke-width="3"/><circle cx="250" cy="112" r="4" fill="#0a8ad6"/></g>
  <g class="label s2">
    <text x="250" y="80" text-anchor="middle" class="mono" fill="#58a6ff" font-size="15" font-weight="700">LEVEL UP</text>
    <text x="250" y="148" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="600">Windows Admin IV</text>
    <text x="250" y="168" text-anchor="middle" class="sans" fill="#8b949e" font-size="12">AD · identity · networking</text>
  </g>

  <!-- 2023 -->
  <g class="stop s3"><circle cx="410" cy="112" r="11" fill="#0d1117" stroke="#00a3d9" stroke-width="3"/><circle cx="410" cy="112" r="4" fill="#00a3d9"/></g>
  <g class="label s3">
    <text x="410" y="80" text-anchor="middle" class="mono" fill="#58a6ff" font-size="15" font-weight="700">2023</text>
    <text x="410" y="148" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="600">18 years complete</text>
    <text x="410" y="168" text-anchor="middle" class="sans" fill="#8b949e" font-size="12">5 firewalls, 1 weekend</text>
  </g>

  <!-- AZ-104 -->
  <g class="stop s4"><circle cx="570" cy="112" r="11" fill="#0d1117" stroke="#00c8ea" stroke-width="3"/><circle cx="570" cy="112" r="4" fill="#00c8ea"/></g>
  <g class="label s4">
    <text x="570" y="80" text-anchor="middle" class="mono" fill="#58a6ff" font-size="15" font-weight="700">AZ-104</text>
    <text x="570" y="148" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="600">Azure Administrator</text>
    <text x="570" y="168" text-anchor="middle" class="sans" fill="#8b949e" font-size="12">Microsoft Certified</text>
  </g>

  <!-- NOW -->
  <circle cx="730" cy="112" r="11" fill="none" stroke="#00F7FF" stroke-width="2" class="ping"/>
  <g class="stop s5"><circle cx="730" cy="112" r="11" fill="#06323d" stroke="#00F7FF" stroke-width="3"/><circle cx="730" cy="112" r="4" fill="#00F7FF"/></g>
  <g class="label s5">
    <text x="730" y="80" text-anchor="middle" class="mono" fill="#00F7FF" font-size="15" font-weight="700">NOW</text>
    <text x="730" y="148" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="600">Cloud + AI agents</text>
    <text x="730" y="168" text-anchor="middle" class="sans" fill="#8b949e" font-size="12">building CAOS</text>
  </g>
</svg>
